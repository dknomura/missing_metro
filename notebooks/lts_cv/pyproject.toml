[project]
name = "lts-cv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "huggingface-hub>=2.4.0",
    "ipywidgets>=8.1.9",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "safetensors>=0.8.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
